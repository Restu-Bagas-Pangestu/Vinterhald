<title>Hold Vinterhald</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Noto+Sans+Runic&display=swap">
<style>
/* Layout: full-bleed 3D hold map; HUD across the top, build bar along the bottom, hold ledger docked right (bottom sheet on phones) */
:root{
  --ink:#10171c; --glass:rgba(16,23,28,.86); --glass2:rgba(29,40,48,.92); --line:rgba(160,185,200,.18);
  --frost:#dbe8ef; --parch:#ece4d2; --muted:#9aabb5; --ember:#e8973f; --ember-soft:rgba(232,151,63,.18);
  --good:#92c287; --bad:#e06a52; --arcane:#9dbcf7;
  --f-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --f-rune:"Noto Sans Runic","Segoe UI Historic",serif;
  --gl:max(12px,env(safe-area-inset-left,0px)); --gr:max(12px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--parch);overflow:hidden}
body{font-family:var(--f-body);font-size:15px;line-height:1.42}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden;background:#a9bfcc}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* HUD */
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:var(--gl);right:var(--gr);display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none;z-index:4}
.hud>*{pointer-events:auto}
.crest{padding:7px 14px 8px;display:flex;flex-direction:column;justify-content:center}
.crest .runes{font-family:var(--f-rune);color:var(--ember);letter-spacing:.35em;font-size:11px;line-height:1}
.crest h1{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05;margin:2px 0 0;color:var(--frost)}
.crest .date{font-family:var(--f-label);color:var(--muted);letter-spacing:.05em;font-size:13px}
.resbar{display:flex;flex-wrap:wrap;gap:4px 16px;padding:7px 14px;align-items:center;flex:1 1 420px;min-width:0}
.res{display:flex;flex-direction:column;min-width:52px}
.res .k{font-family:var(--f-label);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.res .v{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--frost);line-height:1.1}
.res .r{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
.res .r.up{color:var(--good)} .res .r.dn{color:var(--bad)} .res .v.low{color:var(--bad)}
.res.sep{border-left:1px solid var(--line);padding-left:14px}
.ctrl{display:flex;gap:6px;align-items:center;padding:6px 8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;font-family:var(--f-label);font-size:13.5px;letter-spacing:.04em;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ember);color:#1b1209}
.ghost{background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-family:var(--f-label);font-size:13.5px;letter-spacing:.04em;color:var(--muted)}
.ghost.arm{border-color:var(--bad);color:var(--bad)}

/* camera buttons */
.cam{position:absolute;left:var(--gl);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);display:flex;flex-direction:column;gap:4px;z-index:4}
.cam button{width:34px;height:34px;border-radius:5px;background:var(--glass);border:1px solid var(--line);font-size:17px;line-height:1;color:var(--frost)}

/* build bar */
.build{position:absolute;left:var(--gl);right:calc(var(--gr) + 362px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;display:flex;flex-direction:column;gap:6px;padding:8px}
.bcat{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}.bcat::-webkit-scrollbar{display:none}
.bcat button{flex:none;background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 9px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.bcat button:hover{color:var(--frost)}.bcat button.on{color:var(--frost);border-color:var(--ember);background:var(--ember-soft)}
.bcat .bmin{margin-left:auto;font-size:14px;color:var(--parch);border-color:var(--line);position:sticky;right:0;background:var(--glass2,#1b222b)}
.build.min .hint,.build.min .bar{display:none}.build.min .bcat button.on{border-color:transparent;background:transparent;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 4px}
.hint b{color:var(--ember);font-weight:500}
.bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.bb{flex:none;width:118px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--glass2);border:1px solid var(--line);border-radius:5px;padding:4px 6px 6px;text-align:center}
.bb img{width:58px;height:58px}
.bb .nm{font-size:13px;font-weight:500;line-height:1.1;color:var(--parch)}
.bb .cs{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.bb.sel{border-color:var(--ember);background:var(--ember-soft)}
.bb:disabled{opacity:.4;cursor:not-allowed}

/* ledger */
.ledger{position:absolute;right:var(--gr);top:calc(env(safe-area-inset-top,0px) + var(--ht,60px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:350px;z-index:5;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 5px 8px;font-family:var(--f-label);letter-spacing:0;font-size:12.5px;flex:1 0 auto;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--frost);border-bottom-color:var(--ember)}
.tabs .mn{margin-left:auto;font-size:15px;color:var(--frost);padding:6px 10px;flex:none;position:sticky;right:0;background:var(--glass,#151b22);box-shadow:-8px 0 8px -4px rgba(0,0,0,.5)}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs .x{display:none}
.ledger.min{bottom:auto}
.ledger.min #panel{display:none}
.ledger.min .tabs{border-bottom:0}
#panel{padding:12px 14px 16px;overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}
#panel>*{flex-shrink:0}
.booktog{display:none}
@media (max-width:820px){
  .ledger{left:var(--gl);width:auto;top:auto;height:58%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .ledger.shut{display:none}
  .ledger.min{height:auto}
  .tabs .x{display:block}
  .build{right:var(--gr)}
  .booktog{display:block}
  .resbar{flex-basis:100%;order:3}
  .crest h1{font-size:20px}
  .res .r{display:none} .resbar{gap:2px 12px;padding:6px 10px} .res .v{font-size:15px}
  .cam{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--frost);line-height:1.1;text-wrap:balance}
h3{font-family:var(--f-label);font-weight:700;font-size:12.5px;letter-spacing:.09em;color:var(--muted);margin:0}
.sub{color:var(--muted);font-size:14px}
.back{align-self:flex-start;background:none;border:0;color:var(--ember);font-family:var(--f-label);letter-spacing:.05em;padding:0}
.strata{display:flex;flex-direction:column;gap:4px}
.stratum{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.stratum .bar2{height:9px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.stratum .bar2 i{display:block;height:100%;background:var(--frost);opacity:.75}
.stratum.top .bar2 i{background:var(--ember);opacity:1}
.stratum span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.sortrow{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.sortrow button{background:none;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:13px;color:var(--muted)}
.sortrow button.on{color:var(--frost);border-color:var(--frost)}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:10px minmax(0,1fr) 54px 28px;gap:9px;align-items:center;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.crow:hover{background:rgba(255,255,255,.04)}
.dot{width:10px;height:10px;border-radius:50%}
.crow .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .t{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .t.of{color:var(--ember)}
.crow .age{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mini{height:5px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--frost)}
.badge{display:inline-flex;gap:6px;font-family:var(--f-label);letter-spacing:.05em;font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--ember);color:var(--ember)}
.skills{display:flex;flex-direction:column;gap:7px}
.sk{display:grid;grid-template-columns:104px 1fr 32px;gap:8px;align-items:center;font-size:13.5px}
.sk .tr{height:8px;background:rgba(255,255,255,.08);border-radius:2px;position:relative;overflow:hidden}
.sk .tr i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7f97a4,var(--frost))}
.sk.main .tr i{background:linear-gradient(90deg,#9a5f26,var(--ember))}
.sk .tr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(16,23,28,.8) calc(20% - 1px) 20%)}
.sk .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--frost)}
.sk .lb small{color:var(--ember);letter-spacing:-.1em;margin-left:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-family:var(--f-label);letter-spacing:.05em;font-size:13.5px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.prim{border-color:var(--ember);color:var(--ember)}
.btn.big{background:var(--ember);color:#1b1209;border-color:var(--ember);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:4px;padding:7px 10px}
.pos{border:1px solid var(--line);border-radius:5px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.pos.held{border-color:rgba(232,151,63,.55)}
.pos.locked{opacity:.5}
.pos .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pos .hd b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--frost)}
.pos .req{font-size:12.5px;color:var(--muted)}
.pos .bon{font-size:13px;color:var(--good)}
.holder{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.holder button{background:none;border:0;padding:0;color:var(--ember);text-align:left;font-weight:500}
.cands{display:flex;flex-direction:column;gap:3px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) 30px auto;gap:8px;align-items:center;font-size:13px}
.cand span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.cand .btn{padding:1px 8px;font-size:12px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log .rn{font-family:var(--f-rune);font-size:15px;color:var(--muted);text-align:center;line-height:1.3}
.log .promo .rn,.log .skill .rn{color:var(--ember)} .log .death .rn,.log .bad .rn{color:var(--bad)} .log .birth .rn,.log .good .rn{color:var(--good)} .log .event .rn,.log .land .rn{color:var(--arcane)}
.log time{display:block;font-size:11.5px;color:var(--muted);font-family:var(--f-label);letter-spacing:.05em}
.notes{font-size:14.5px;display:flex;flex-direction:column;gap:11px}
.notes p{margin:0} .notes ul,.notes ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.notes .loop{font-family:var(--f-label);letter-spacing:.04em;color:var(--frost);background:rgba(255,255,255,.05);border-radius:4px;padding:8px 10px;font-size:13.5px}

#vig{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(20,26,30,.38) 100%)}
/* labour stats */
.res .v small{font-size:11.5px;color:var(--muted);font-weight:500}
.res .v.full{color:#e9c35a}
.lleg{display:grid;grid-template-columns:auto auto;gap:1px 10px;font-size:11px;color:var(--muted);line-height:1.35;white-space:nowrap}.lleg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:0}.lleg b{color:var(--parch);font-weight:600;font-variant-numeric:tabular-nums}
.lbar{display:flex;height:8px;width:140px;border-radius:2px;overflow:hidden;margin:5px 0 3px;background:rgba(255,255,255,.08)}
.lbar i{display:block;height:100%}
.lbar.big{width:100%;height:14px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:rgba(255,255,255,.04);border-radius:4px;padding:7px 9px;display:flex;flex-direction:column}
.kpis b{font-size:20px;color:var(--frost);font-variant-numeric:tabular-nums;line-height:1.1}.kpis b.bad{color:var(--bad)}
.kpis span{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px}
.legend div{display:grid;grid-template-columns:10px 1fr auto 36px;gap:7px;align-items:center}
.legend i,.legend.inline i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--frost)}.legend em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend.inline{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}.legend.inline span{display:inline-flex;gap:5px;align-items:center}
.chart{width:100%;height:auto;display:block}
.cap{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);border-radius:5px;padding:9px 11px}
.caph{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-label);letter-spacing:.06em;font-size:13px;color:var(--muted)}.caph b{font-size:20px;color:var(--frost);font-family:var(--f-body)}
.capbar{height:8px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}.capbar i{display:block;height:100%;background:linear-gradient(90deg,#9a5f26,var(--ember))}
.note.good{color:var(--good)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th:not(:first-child):not(:last-child),.tbl td:not(:first-child):not(.tx){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td small{display:block;color:var(--muted);font-size:11.5px}
.kv dd.neg{color:var(--bad)}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder li{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);text-align:center;line-height:1.15}
.ladder li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:12px}
.ladder li.done span{background:rgba(146,194,135,.25);border-color:var(--good);color:var(--good)}
.ladder li.cur{color:var(--frost);font-weight:600}.ladder li.cur span{background:var(--ember);border-color:var(--ember);color:#1b1209}
.tbl .ok{color:var(--good)}.tbl .no{color:var(--bad)}
.tbl.tiers tr.cur td:first-child{color:var(--ember);font-weight:600}
.tabs button.ready{position:relative}.tabs button.ready::after{content:"";position:absolute;top:7px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--ember)}
.chip{display:inline-block;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--frost);line-height:1.5;vertical-align:1px}
.chip.t-rajin{border-color:#92c287;color:#92c287}.chip.t-pemalas{border-color:#9aabb5;color:#9aabb5}.chip.t-ambisius{border-color:#e8973f;color:#e8973f}.chip.t-setia{border-color:#9dbcf7;color:#9dbcf7}.chip.t-serakah{border-color:#e9c35a;color:#e9c35a}
.traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}.traits li{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start}
.traits em{display:block;font-style:normal}.traits .pl{color:var(--good)}.traits .mi{color:var(--bad)}
.mini.wide{display:inline-block;width:80px;vertical-align:middle}
.note.bad{color:#f0a594;border:1px solid rgba(224,106,82,.4)}
.neg{color:var(--bad)}
.btn.sm{padding:2px 9px;font-size:12px}
.elec{display:flex;flex-direction:column;gap:4px}.elec b{font-family:var(--f-display);font-weight:400;color:var(--frost);font-size:16px}
.tbl tr.win td:first-child{color:var(--ember);font-weight:600}
.tbl td small{color:var(--muted)}
.sx{font-weight:700;font-size:1.1em;font-family:'Segoe UI Symbol','Noto Sans Symbols','DejaVu Sans',system-ui,sans-serif;line-height:1}.sx.m{color:#7fb2f0}.sx.f{color:#f08fb0}
.tbl td.good{color:var(--good);font-weight:600}
.tbl tr.dim td{color:var(--muted)}
.tbl td em{font-style:normal;color:var(--muted)}
.relwrap{overflow-x:auto}.tbl.rel td,.tbl.rel th{text-align:center!important;padding:4px}.tbl.rel td:first-child{text-align:left!important;color:var(--muted)}.tbl.rel td.self{color:var(--muted)}
.merc{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 140px);z-index:8;background:var(--glass2);border:1px solid var(--bad);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;max-width:min(92vw,460px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.merc b{font-family:var(--f-display);font-weight:400;font-size:18px;color:#f0a594}.merc span{font-size:13px;color:var(--muted)}
.qcard{border:1px solid var(--line);border-radius:5px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.qcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.qcard .hd b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--frost)}
.tag{font-family:var(--f-label);font-size:11px;letter-spacing:.05em;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.tag.ruins{color:#9dbcf7;border-color:#9dbcf7}.tag.den{color:#e8973f;border-color:#e8973f}.tag.clear{color:#f0a594;border-color:#f0a594}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}.qmeta b{color:var(--frost)}

    if(pool.length){const c=pool.sort((a,b)=>a.skills[best(a)]-b.skills[best(b)])[0];open.set(c.job,open.get(c.job)+1);c.job=s.id;open.set(s.id,open.get(s.id)-1)}}
  for(const c of idle){let bb=null,bs=-1;for(const b of S.blds){if(!b.done||!(open.get(b.id)>0))continue;const s=score(c,b);if(s>bs){bs=s;bb=b}}if(bb){c.job=bb.id;open.set(bb.id,open.get(bb.id)-1)}}

  return false;
}

<p><b>Konsep.</b> City-builder 3D low-poly di utara bersalju dengan cara bangun seperti game simulasi kota: seluruh peta bisa langsung dibangun, penduduk tumbuh dan berkembang, dan yang paling cakap memegang jabatan.</p>
<div class="loop">Bangun → tarik jalan ke gudang → warga bekerja sendiri → keahlian naik → diangkat ke jabatan → bonus memperkuat hold → populasi tumbuh</div>
<h3>Peta & bangunan</h3>
<ul><li>Tidak ada klaim wilayah. Seluruh peta bisa dibangun sejak awal.</li>
<li>Jenis medan menentukan bangunan yang cocok: kamp penebang di hutan, tambang di pegunungan, dermaga di tepi danau, ladang di padang.</li>
<li>Sarang serigala dan kamp bandit menutup area sekitarnya sampai diserbu. Reruntuhan kuno bisa digali untuk emas dan pengetahuan.</li>
<li>Pintu bangunan selalu menghadap ke depan, jadi petak di depan pintu harus kosong.</li></ul>
<h3>Jalan & gerobak</h3>
<ul><li>Jalan dibangun dengan klik lalu seret (2 kayu per petak) dan bisa dihapus kapan saja.</li>
<li>Jalan hanya untuk kendaraan. Jika petak depan pintu bangunan produksi tersambung jalan ke petak depan pintu gudang, gerobak kuda otomatis mengangkut hasilnya dan produksi naik 20%.</li>
<li>Gerobak butuh kuda dari Kandang Kuda yang pintunya juga tersambung jalan ke gudang. Panel kandang menampilkan kebutuhan kuda dalam persen; di atas 100% berarti perlu kandang baru.</li>
<li>Penduduk tidak wajib memakai jalan. Mereka berjalan bebas, memutari bangunan, dan masuk lewat pintu.</li></ul>
<h3>Tingkatan hold</h3>
<ul><li>Dusun → Desa → Kota → Ibu Kota Hold. Naik tingkat butuh syarat (penduduk, bangunan, jabatan terisi, kebahagiaan) dan biaya peresmian.</li>
<li>Tiap tingkat membuka bangunan, jabatan, dan ras baru, plus keuntungan tetap. Balai Jarl ikut membesar dan berhias.</li>
<li>Dusun: hanya manusia. Desa: kurcaci dan orc. Kota: felin. Ibu Kota Hold: elf.</li></ul>
<h3>Festival musim</h3>
<ul><li>Empat festival seluruh hold: Pesta Bunga Semi, Malam Matahari, Pesta Panen, Malam Api Unggun. Lima festival ras: Cahaya Bintang (Elf), Turnamen Taring (Orc), Pasar Malam Bulan (Felin), Pesta Tong Tua (Kurcaci), Upacara Leluhur (Manusia).</li>
<li>Tiga hari sebelumnya muncul kartu pilihan: Tidak dirayakan, Sederhana, Meriah, atau Megah. Makin megah makin mahal (makanan, emas, mead, roti, kayu untuk api unggun) dan makin besar efeknya: kebahagiaan, pendatang, reputasi, hubungan antar-ras, atau suasana ras.</li>
<li>Efek khusus: pernikahan (Bunga), reputasi (Matahari), makanan +10% (Panen), kehangatan musim dingin (Api Unggun), emas (Pasar Malam), juara tarung (Turnamen).</li>
<li>Lapangan Festival (unik, 25 kayu + 30 batu): tempat semua festival digelar, efek festival +25% dan produksi hari festival turun lebih sedikit. Dekorasi festival kini muat di satu petak sehingga tidak menembus bangunan lain.</li>
<li>Pada hari festival produksi turun karena warga libur. Mulai pukul 15:00 warga berkumpul menari di sekitar api unggun dan lentera di depan balai, dan musik menjadi lebih riang.</li></ul>
<h3>Pengangkutan ke gudang</h3>
<ul><li>Hasil produksi dan panen tidak langsung masuk hitungan. Hasil disimpan dulu di tempat produksi (kapasitas 12 + 8 × jumlah pekerja), lalu diangkut pekerja ke Gudang terdekat (atau Balai Jarl bila belum ada gudang) selama jam kerja. Angka di panel atas baru bertambah setelah barang masuk gudang.</li>
<li>Kecepatan angkut: 0,5 per pekerja per jam, ditambah 2,5 per jam bila bangunan dilayani gerobak, dibagi jarak ke gudang. Badai dan salju memperlambat. Jika penyimpanan sementara penuh, produksi berhenti.</li>
<li>Laju "+x/hari" di panel atas menghitung barang yang benar-benar masuk gudang kemarin.</li></ul>
<h3>Ladang gandum</h3>
<ul><li>Ladang Gandum adalah lumbung dengan petak tanam di sekitarnya (mulai dengan ±4 petak). Klik ladang untuk menambah atau menghapus petak (5 kayu per petak, harus bersebelahan).</li>
<li>Jumlah petak tidak dibatasi; yang membatasi panen adalah kemampuan pekerja. Tingkat ladang menambah jumlah pekerja: kecil 3 → sedang 5 (40 kayu + 20 batu) → besar 8 (70 kayu + 40 batu + 30 emas).</li>
<li>Siklus tiap petak terlihat di peta: tanah diolah → benih ditabur → tunas tumbuh hijau → gandum menguning siap panen → jerami dan ikatan gandum. Menabur dan memanen masing-masing butuh 1 tenaga; merawat butuh tenaga kecil tiap hari. Petak yang melebihi kemampuan pekerja terlambat ditanam, dan panen yang terlambat menyusut.</li>
<li>Pertumbuhan: semi normal, panas tercepat, gugur lebih lambat, musim dingin berhenti. Hujan mempercepat, kemarau memperlambat.</li></ul>
<h3>Keputusan, dekret, dan cuaca</h3>
<ul><li>Keputusan bercabang: 15 kejadian (pengungsi, pedagang misterius, sengketa antar-ras, anak hilang, tikus di lumbung, sumur keruh, penyair, tantangan duel, utusan bandit, urat bijih, keributan penginapan, demam, ulang tahun pernikahan, peziarah, telur naga). Kartu muncul dengan 2–3 pilihan berbiaya dan berakibat; bila 3 hari tidak dipilih, pilihan bawaan berlaku.</li>
<li>Dekret Jarl (tab Jabatan): Pajak Tinggi, Lembur Malam, Wajib Militer, Hari Libur, Ransum Hemat, Pintu Terbuka, Hukum Ketat, Patronase Seni. Slot 1/2/3 sesuai tingkat hold; tiap dekret punya untung, rugi, dan efek suasana ras.</li>
<li>Cuaca berpengaruh: hujan menyuburkan ladang dan meredam kebakaran; salju dan badai memperlambat kerja luar ruang dan pembangunan; kemarau di musim panas melipatgandakan risiko kebakaran. Arahkan kursor ke tanggal untuk melihat efek cuaca hari ini dan ramalan besok.</li></ul>
<h3>Waktu, bangunan, dan air</h3>
<ul><li>Jam kerja 08.00–17.00: di luar jam itu tidak ada yang bekerja atau membangun; warga bersantai, ke Penginapan, lalu tidur di rumah pukul 22.00–06.00. Hanya Penginapan (termasuk papan misi petualang) yang buka 24 jam. Produksi dan pembangunan harian tetap sama karena dihitung untuk satu giliran kerja.</li>
<li>Jam: 1 jam = 4 detik pada kecepatan 1×, jadi satu hari ±1,6 menit, satu musim ±19 menit, dan satu tahun ±77 menit. Kecepatan 3× = 32 detik per hari, 8× = 12 detik, 24× = 4 detik.</li>
<li>Semua ras bisa datang sejak awal. Pemain memberi nama hold dan memilih Jarl pertama dari empat kandidat. Nama hold bisa diganti kapan saja (ikon pena di judul).</li>
<li>Tingkat tertinggi kini Kerajaan: Jarl bergelar Raja, membuka Panglima Kerajaan dan Monumen Raja.</li>
<li>Pondok Tukang: tukang membangun 2× lebih cepat per orang dan memperbaiki bangunan yang aus oleh cuaca, rusak oleh serangan, atau terbakar.</li>
<li>Sumur: sumber air dengan radius 5 petak. Dibutuhkan rumah untuk naik tingkat dan kebahagiaan, membuat Toko Roti dan Kedai Bir bekerja penuh, dan memadamkan kebakaran jauh lebih cepat. Pandai besi, toko roti, dan kedai bir paling rawan terbakar; api bisa merambat ke bangunan di sebelahnya, dan naga kini membakar bangunan.</li></ul>
<h3>Suasana & tampilan</h3>
<ul><li>Grafis (v19): pilihan kualitas Rendah/Sedang/Tinggi. Sedang dan Tinggi memakai efek layar: bloom untuk api dan lentera, tilt-shift (tepi layar kabur seperti miniatur), koreksi warna, vinyet, dan anti-aliasing; Tinggi menambah ambient occlusion dan bayangan 4096.</li>
<li>Tanah bertekstur prosedural (bintik rumput, lereng berbatu, pasir basah dan buih di tepi air) dengan bayangan awan yang bergerak; air berkilau. Pohon, semak, dan rumput bergoyang tertiup angin.</li>
<li>Cuaca harian: Cerah, Mendung, Hujan, Bersalju, Badai salju. Cuaca mengubah langit, cahaya, kekuatan angin, dan partikel hujan atau salju di sekitar kamera.</li></ul>
<ul><li>Siklus siang–malam mengikuti jam (satu hari ±1,6 menit pada kecepatan 1×): langit, cahaya matahari dan bulan berubah; jendela, obor, dan tungku memancarkan cahaya di malam hari; warga yang menganggur lebih banyak pulang.</li>
<li>Suara dibuat langsung di browser: musik ambient Nordik (drone, seruling modal, tabuhan pelan), angin yang makin kencang di musim dingin, efek palu, kapak, dan beliung dari warga yang bekerja di dekat kamera, terompet tanda serangan, dan lonceng kafilah. Musik dan efek bisa dinyalakan terpisah.</li>
<li>Peta tampilan: Kebahagiaan (kepuasan penghuni per lingkungan), Layanan (jumlah layanan yang menjangkau tiap petak), dan Jalan (kepadatan lalu lintas gerobak dan kafilah). Aula Keluarga kini butuh Pasar dan Kuil dalam jangkauan.</li></ul>
<h3>Ekonomi berlapis</h3>
<ul><li>Rantai produksi: Ladang Gandum → Penggilingan → Toko Roti; Pondok Pemburu (daging + kulit) → Penjahit (pakaian hangat); Peternakan Lebah → Kedai Bir (mead).</li>
<li>Rumah bertingkat: Pondok (4 jiwa) → Rumah Panjang (6) → Aula Keluarga (10). Naik otomatis jika syarat terpenuhi 6 hari dan ada bahan renovasi. Tiap tingkat membayar pajak lebih besar.</li>
<li>Penghuni Rumah Panjang ke atas makan roti (hemat makanan) dan memakai pakaian hangat; Aula Keluarga juga minum mead. Tanpa pakaian di musim dingin warga kedinginan.</li>
<li>Kafilah dagang datang berkala lewat jalan dari tepi peta ke depan Pasar. Harga 12 barang naik turun tiap hari; jual-beli besar ikut menggeser harga. Pengurus Istana dan pedagang Felin memberi harga lebih baik.</li></ul>
<h3>Petualang, misi, dan reputasi</h3>
<ul><li>Penginapan memasang papan misi: menjelajah reruntuhan, memburu monster, atau membersihkan sarang musuh di peta. Kirim sampai 3 orang: petualang yang menginap atau warga mahir (Bertarung/Sihir ≥ 60).</li>
<li>Peluang berhasil dihitung dari kekuatan rombongan dibanding kesulitan misi. Sukses memberi emas, reputasi, dan kadang pusaka dengan efek permanen. Gagal bisa merenggut anggota rombongan.</li>
<li>Saat bandit, serigala, atau naga menyerang, petualang yang menginap bisa disewa sebagai tentara bayaran untuk menambah pertahanan.</li>
<li>Reputasi (Tak dikenal → Legendaris) menambah kedatangan petualang dan level mereka. Di reputasi tinggi, pahlawan langka mulai datang.</li></ul>
<h3>Kebutuhan & hubungan ras</h3>
<ul><li>Tiap ras punya kebutuhan bangunan: Manusia (Penginapan, Kuil), Elf (Kuil, Taman), Orc (Arena), Kurcaci (Kedai Bir), Felin (Pasar). Tiap bangunan melayani sejumlah warga ras itu.</li>
<li>Suasana ras dipengaruhi kebutuhan, hubungan dengan ras lain, kebahagiaan hold, dan kejadian. Suasana memengaruhi kerja, kesetiaan, jumlah pendatang ras itu, dan bisa membuat warga pergi.</li>
<li>Hubungan antar-ras punya nilai awal (misalnya Elf–Orc −35, Manusia–Kurcaci +20) yang berubah lewat pernikahan, festival, duel, perkelahian, dan hidup bertetangga.</li>
<li>Distrik = area tempat rumah warga. Distrik campuran yang harmonis mendapat produksi +10%; yang tegang −5% dan rawan perkelahian.</li>
<li>Kejadian khusus acak: Duel Kehormatan (Orc) dan Perburuan Agung (Felin). Festival ras kini ada di kalender festival.</li></ul>
<h3>Sifat dan keluarga</h3>
<ul><li>Tiap warga punya 1–2 sifat: Rajin, Pemalas, Ambisius, Setia, Serakah. Masing-masing punya kelebihan dan kekurangan yang nyata di simulasi.</li>
<li>Warga dewasa menikah (biasanya sesama ras, kadang antar-ras). Hanya pasangan menikah yang punya anak. Anak mewarisi bakat rata-rata orang tua, satu bakat alami, dan sifat.</li>
<li>Tidak ada dinasti: satu-satunya garis kelompok adalah ras, dan semua konflik politik terjadi antar-ras.</li></ul>
<h3>Politik</h3>
<ul><li>Pejabat dan penantang berkampanye sepanjang tahun. Yang ambisius lebih giat, yang serakah membagi-bagikan emas.</li>
<li>Tiap awal tahun ada pemilihan untuk setiap jabatan. Warga memilih berdasarkan keahlian, kampanye, kesamaan ras, dan kesetiaan pada petahana. Hasil dan basis dukungan per ras tercatat di tab Jabatan.</li>
<li>Pejabat serakah bisa menggelapkan kas. Makin banyak yang dicuri, makin besar peluang ketahuan dan dicopot.</li>
<li>Warga ambisius yang kecewa dan kesetiaannya rendah bisa mencoba kudeta terhadap Jarl. Hasilnya ditentukan pendukung lawan pembela, jumlah penjaga, dan kesetiaan Kapten.</li>
<li>Pemain bisa mengangkat dan mencopot pejabat; mencopot membuat ras pejabat itu tersinggung.</li><li>Pemberontakan ras: jika suasana sebuah ras (≥3 warga dewasa, ≥20% penduduk, bukan ras Jarl) di bawah 35%, mereka bisa bangkit di bawah pemimpin terbaiknya. Ras itu melawan semua ras lain beserta penjaga.</li></ul>
<h3>Ras penduduk</h3>
<ul><li>Lima ras: Manusia, Elf, Orc, Kurcaci, dan Felin (manusia berkepala harimau, singa, macan tutul, atau macan kumbang).</li>
<li>Tiap ras punya wujud, nama, umur, dan bakat sendiri. Elf hidup sangat lama dan berbakat sihir. Orc kuat tapi berumur pendek. Kurcaci ahli menempa. Felin pandai berdagang dan bertarung.</li>
<li>Anak mewarisi ras orang tuanya. Pendatang dan petualang datang dari semua ras.</li></ul>
<h3>Penginapan</h3>
<ul><li>Petualang berbagai ras datang dari tepi peta, menginap beberapa hari, membayar emas, lalu pergi. Kadang ada yang memilih menetap.</li>
<li>Penginapan juga tempat hiburan: kebahagiaan naik dan pendatang lebih sering datang.</li>
<li>Biayanya makanan: dapur memakai 0,25 makanan per hari per penginapan dan tiap tamu makan 0,15 per hari. Jika lumbung kosong, pendapatan turun dan tamu pulang lebih cepat.</li>
<li>Jumlah petualang tampil di HUD dan panel penginapan: yang sedang menginap, yang datang tahun ini, total sejak awal, yang menetap, dan asal rasnya.</li>
<li>Biayanya makanan: dapur penginapan memakai 0,25 makanan per hari ditambah 0,15 per tamu. Tanpa makanan, pendapatan turun dan tamu cepat pergi.</li></ul>
<h3>Tenaga kerja & gudang</h3>
<ul><li>Tenaga kerja dihitung agregat: persentase bekerja, pengangguran, anak, dan lansia dari total populasi, plus jumlah lapangan kerja.</li>
<li>Bangunan hanya menampilkan kapasitas maksimum dan persentase produksi.</li>
<li>Kapasitas simpan 60 + 300 per gudang untuk tiap bahan. Emas disimpan sebagai kas di Balai Jarl.</li></ul>
<h3>Keahlian & jabatan</h3>
<ul><li>8 keahlian (0–100) dengan bakat berbeda per warga. Naik lewat kerja, makin lambat makin tinggi.</li>
<li>8 jabatan dengan syarat bangunan dan keahlian. Diisi otomatis, ditinjau di sidang tahunan, atau diangkat langsung oleh pemain.</li></ul>
<h3>Ide tahap berikutnya</h3>
<ol><li>Jenis jalan bertingkat (tanah, batu) dengan kecepatan gerobak berbeda.</li><li>Pasar antar-hold lewat jalan dagang di tepi peta.</li><li>Pindah ke Godot atau Unity jika loop inti sudah terbukti seru.</li></ol>
<p class="sub">Dunia, nama, dan model 3D di sini original, tanpa memakai aset atau nama game lain.</p></div>`}
function renderPanel(){
  document.querySelectorAll('#tabs button[data-a="tab"]').forEach(b=>b.classList.toggle('on',b.dataset.v===U.tab&&!U.sel));
  let h;
  if(U.sel){if(U.sel.k==='zone')h=viewZone(U.sel.id);else{const o=U.sel.k==='cit'?citById(U.sel.id):bldById(U.sel.id);if(!o)U.sel=null;else h=U.sel.k==='cit'?viewCit(o):viewBld(o)}}
  if(!U.sel)h={pop:viewPop,pos:viewPos,tier:viewTier,quest:viewQuest,trade:viewTrade,log:viewLog,doc:viewDoc}[U.tab]();
  const p=$('#panel'),st=p.scrollTop;p.innerHTML=h;p.scrollTop=st;
}

const LBL=[];

  for(const L of LBL){if(L.z.type==='home')L.v.z-=2.2;L.v.y=Math.max(hAt(L.v.x,L.v.z),0)+(L.z.type==='mountain'?.9:.6)}}
const PV=new THREE.Vector3();

  for(const L of LBL){const z=L.z.id,st=S.zones[z],show=st.hostile||(L.z.type==='ruins'&&!st.dug);
    if(text&&show){L.el.className='zl'+(st.hostile?' hostile':'');L.el.innerHTML=`<b>${st.hostile?ZT[L.z.type].n:'Reruntuhan kuno'}</b><span>${st.hostile?'kekuatan '+zoneStr(z):'gali · 20 kayu'}</span>`}
    PV.copy(L.v).project(camera);const vis=show&&PV.z<1&&Math.abs(PV.x)<1.1&&Math.abs(PV.y)<1.1&&CAM.d<36;L.el.style.display=vis?'':'none';

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.v,act=a.dataset.a;
  if(['zoom','rot','home'].includes(act)){
    if(act==='zoom')CAM.d=clamp(CAM.d*(+v>0?1.2:1/1.2),7,40);else if(act==='rot')CAM.yaw+=+v*Math.PI/8;else{const h=hallPos();CAM.tx=h.x;CAM.tz=h.z+1;CAM.d=21;CAM.yaw=0}
    updCam();return}
  if(act!=='newgame'&&act!=='demolish'&&act!=='dismiss')U.confirm=null;
  if(act==='speed')U.speed=+v;
  else if(act==='tab'){setMin(false);U.tab=v;U.sel=null;world.borders=world.paint=true;$('#panel').scrollTop=0}
  else if(act==='cit'||act==='bld'||act==='zone'){U.sel={k:act,id:+v};world.borders=world.paint=true;$('#panel').scrollTop=0;
    let p=null;if(act==='cit'){const ag=AG.get(+v);if(ag)p={x:ag.x,z:ag.z};startFollow(+v)}else if(act==='bld'){const b=bldById(+v);if(b)p=cellC(b.cx,b.cy)}else p={x:Wd.zones[+v].cx-GW/2,z:Wd.zones[+v].cy-GH/2};
    if(act!=='cit')stopFollow();if(p){CAM.tx=p.x;CAM.tz=p.z;updCam()}}
  else if(act==='back'){U.sel=null;stopFollow();world.borders=world.paint=true}
  else if(act==='follow'){if(U.follow===+v)stopFollow();else startFollow(+v)}
  else if(act==='sort')U.sort=v;
  else if(act==='bcat'){U.bcat=v;U.bmin=false;try{localStorage.setItem('vh-bcat',JSON.stringify({c:U.bcat,m:U.bmin}))}catch(e){}renderPalette();return}
  else if(act==='bmin'){U.bmin=!U.bmin;try{localStorage.setItem('vh-bcat',JSON.stringify({c:U.bcat,m:U.bmin}))}catch(e){}renderPalette();return}
  else if(act==='build'){U.build=U.build===v?null:v;U.rd=null;setGhost(U.build&&BLD[U.build]?U.build:null);previewRoad()}
  else if(act==='appoint'){const c=citById(+v);if(c){appoint(a.dataset.k,c,`${c.name} diangkat langsung menjadi ${POS[a.dataset.k].n}.`);syncAgents();toast(`${c.name} kini ${POS[a.dataset.k].n}`)}}
  else if(act==='demolish'){if(U.confirm==='d'+v){const b=bldById(+v);S.blds=S.blds.filter(x=>x!==b);log(`${BLD[b.type].n} di ${Wd.zones[b.z].name} dibongkar.`,'build');U.sel=null;U.confirm=null;assignJobs();fillPositions();syncBuildings();syncAgents()}else U.confirm='d'+v}
  else if(act==='dig')dig(+v);
  else if(act==='tierup')tierUp();
  else if(act==='pickjarl'){pickJarl(+v);return}
  else if(act==='gq'){U.gq=v;try{localStorage.setItem('vh-gq',v)}catch(e){}applyGQ();toast(`Kualitas grafis: ${GQN[v]}`);return}
  else if(act==='ovmin'){setOvMin(!$('#ovp').classList.contains('min'));return}
  else if(act==='plotadd'||act==='plotdel'){const md=act==='plotadd'?'add':'del';if(U.plotMode&&U.plotMode.mode===md&&U.plotMode.id===+v)endPlotMode();else{U.plotMode={id:+v,mode:md};U.build=null;setGhost(null);$('#gl').classList.add('plotting');toast(md==='add'?'Klik petak kosong di sebelah ladang. Klik kanan atau Esc untuk selesai.':'Klik petak ladang yang ingin dihapus. Esc untuk selesai.')}}
  else if(act==='farmup'){upgradeFarm(bldById(+v));return}
  else if(act==='evt'){decide_evt(+v);return}
  else if(act==='decclose'){U.decOpen=false;renderDec();renderFest();return}
  else if(act==='decopen'){U.decOpen=true;renderDec();renderFest();return}
  else if(act==='decon'){decOn(v);return}
  else if(act==='decoff'){decOff(v);return}
  else if(act==='festpick'){if(S.festNext){S.festNext.pick=v;save()}renderFest();return}
  else if(act==='festclose'){U.festOpen=false;renderFest();return}
  else if(act==='festopen'){U.festOpen=true;if(S.dec)U.decOpen=false;renderFest();renderDec();return}
  else if(act==='festgo'){const P=festPlaza();if(P){CAM.tx=P.x;CAM.tz=P.z+.5;CAM.d=Math.min(CAM.d,12);updCam()}return}
  else if(act==='renameopen'){U.rename=true;renderJP();return}
  else if(act==='renameclose'){U.rename=false;renderJP();return}
  else if(act==='renamesave'){const nm=($('#jpname').value||'').trim().slice(0,24);if(nm){const old=hn();S.name=nm;if(nm!==old)log(`${old} kini bernama ${nm}.`,'event');save()}U.rename=false;renderJP();refresh(true);return}
  else if(act==='audio'){setAudio(v,!AU.on[v]);return}
  else if(act==='ov'){U.ov=v;world.paint=true;if(roadMesh)roadMesh.visible=v!=='road';renderOv();return}
  else if(act==='trade'){trade(a.dataset.k,v,10)}
  else if(act==='qpick'){const q=(S.quests||[]).find(x=>x.id===+a.dataset.q);if(q){const st=U.party[q.id]||(U.party[q.id]=new Set());st.has(v)?st.delete(v):st.size<3&&st.add(v)}}
  else if(act==='qgo'){const q=(S.quests||[]).find(x=>x.id===+a.dataset.q);if(q&&q.status==='open'){startQuest(q,U.party[q.id]||[]);delete U.party[q.id];for(const k in U.party)for(const x of [...U.party[k]])if(q.party.includes(x))U.party[k].delete(x);syncAgents();syncAdv()}}
  else if(act==='merc')hireMercs();
  else if(act==='dismiss'){const k=a.dataset.k;if(U.confirm==='x'+k){U.confirm=null;dismiss(k);syncAgents()}else U.confirm='x'+k}
  else if(act==='assault')assault(+v);
  else if(act==='newgame'){openTitle('main',true);return}
  else if(act==='tmenu'){openTitle('main',true);return}
  else if(act==='tsaveopen'){openTitle('save',true);return}
  else if(act==='tcont'){closeTitle();return}
  else if(act==='tclose'){closeTitle();return}
  else if(act==='tview'){if(v==='close'){closeTitle();return}U.title=v;renderTitle();return}
  else if(act==='tnew'){if(readAuto()&&!S.jarlPick){U.title='confirmnew';renderTitle();return}if(U.raid){scene.remove(U.raid.grp);U.raid=null}newGame();save();rebuildWorld();closeTitle();renderJP();return}
  else if(act==='tnewok'){if(U.raid){scene.remove(U.raid.grp);U.raid=null}stopFollow();U.sel=null;newGame();save();rebuildWorld();closeTitle();renderJP();return}
  else if(act==='tload'){const o=v==='auto'?readAuto():readSlot(v);if(!o){toast('Simpanan tidak ditemukan',true);return}loadState(o.S);closeTitle();toast(`${hn()} dimuat`);return}
  else if(act==='tsave'){if(writeSlot(v)){toast(`Tersimpan di Slot ${SLOTS.indexOf(v)+1}`);renderTitle()}return}
  else if(act==='tdel'){if(U.confirmDel===v){try{localStorage.removeItem(v)}catch(e){}U.confirmDel=null;toast('Slot dihapus')}else{U.confirmDel=v;toast('Klik Hapus sekali lagi untuk menghapus slot ini')}renderTitle();return}
  else if(act==='texport'){exportSave();return}
  else if(act==='min'){setMin(!U.min)}
  else if(act==='book'){U.book=!U.book;$('#ledger').classList.toggle('shut',!U.book)}
  refresh();
});

/* ====================== LOOP & BOOT ====================== */

/* ===== Halaman awal: permainan baru & muat permainan (v34) ===== */
const SLOTS=['vh-slot-1','vh-slot-2','vh-slot-3'];
function readSlot(k){try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&o.S&&o.S.v===9&&o.S.seed!=null)return o}catch(e){}return null}
function readAuto(){const s=load();return s?{S:s,at:null}:null}
function writeSlot(k){try{localStorage.setItem(k,JSON.stringify({S,at:Date.now()}));return true}catch(e){toast('Gagal menyimpan: ruang penyimpanan browser penuh',true);return false}}
const dayLab=d=>`Hari ${d%DPS+1} ${SEASONS[Math.floor((d%DPY)/DPS)].replace('Musim ','')}, Tahun ${Math.floor(d/DPY)+1}`;
const whenLab=t=>t?new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
function migrate(){if(!S.roads)S.roads={};for(const k in RES)if(S.res[k]==null)S.res[k]=0;S.blds.forEach(b=>{if(b.type==='house'&&b.lv==null)b.lv=1});
  if(S.hour==null)S.hour=8;if(!S.name)S.name='Vinterhald';for(const b of S.blds)if(b.type==='farm'&&!b.plots){b.flv=1;b.plots=[];autoPlots(b,4)}}
function loadState(st){if(U.raid){scene.remove(U.raid.grp);U.raid=null}endPlotMode&&endPlotMode();stopFollow();U.sel=null;S=st;Wd=genWorld(S.seed);migrate();save();rebuildWorld();lastSeason=season();renderJP();refresh(true)}
function slotHtml(o,label,act,k){if(!o)return `<div class="tslot empty"><div class="tsl"><b>${label}</b><span>Kosong</span></div></div>`;const s=o.S;
  return `<div class="tslot"><div class="tsl"><b>${label}</b><span class="tsn">${(HT[s.tier||0]||HT[0]).n} ${(s.name||'Vinterhald').replace(/</g,'&lt;')}</span><span>${dayLab(s.day||0)} · ${(s.cit||[]).length} jiwa${o.at?' · disimpan '+whenLab(o.at):''}</span></div>
    <div class="tsb">${act?`<button class="btn prim" data-a="${act}" data-v="${k}">${act==='tload'?'Muat':'Timpa'}</button>`:''}${k&&k!=='auto'&&act==='tload'?`<button class="btn" data-a="tdel" data-v="${k}" aria-label="Hapus ${label}">Hapus</button>`:''}</div></div>`}
function renderTitle(){const el=$('#title');if(!el)return;document.body.classList.toggle('titled',!!U.title);if(!U.title){el.hidden=true;return}el.hidden=false;const auto=readAuto(),v=U.title;
  const head=`<div class="tbrand"><span class="trun" aria-hidden="true">ᚹ ᛁ ᚾ ᛏ ᛖ ᚱ</span><h1>Hold Vinterhald</h1><p>Dirikan permukiman di lembah bersalju, pimpin lima ras, dan bangun dusun kecil menjadi kerajaan.</p></div>`;
  let body='';
  if(v==='main')body=`<nav class="tmenu">${auto?`<button class="tbig prim" data-a="tcont"><b>Lanjutkan</b><span>${(HT[auto.S.tier||0]||HT[0]).n} ${(auto.S.name||'Vinterhald').replace(/</g,'&lt;')} · ${dayLab(auto.S.day||0)}</span></button>`:''}
    <button class="tbig${auto?'':' prim'}" data-a="tnew"><b>Permainan Baru</b><span>Mulai dari Balai Jarl dan sekelompok pemukim</span></button>
    <button class="tbig" data-a="tview" data-v="load"><b>Muat Permainan</b><span>Simpanan otomatis, 3 slot, atau file cadangan</span></button>
    ${U.titleFromGame?`<button class="tbig ghost2" data-a="tclose"><b>Kembali ke permainan</b></button>`:''}</nav>`;
  else if(v==='load'||v==='save'){const sv=v==='save';
    body=`<div class="tpanel"><div class="tph"><h2>${sv?'Simpan Permainan':'Muat Permainan'}</h2><button class="btn" data-a="tview" data-v="${U.titleFromGame&&sv?'close':'main'}">${U.titleFromGame&&sv?'Tutup':'← Kembali'}</button></div>
      ${sv?'':slotHtml(auto,'Simpanan otomatis','tload','auto')}
      ${SLOTS.map((k,i)=>slotHtml(readSlot(k),'Slot '+(i+1),sv?'tsave':'tload',k).replace('<div class="tslot empty">',sv?`<div class="tslot empty"><div class="tsb" style="order:2"><button class="btn prim" data-a="tsave" data-v="${k}">Simpan di sini</button></div>`:'<div class="tslot empty">')).join('')}
      <div class="tfile">${sv?`<button class="btn" data-a="texport">Unduh file cadangan (.json)</button><span>Simpan progres ke file, misalnya untuk dipindah ke browser atau perangkat lain.</span>`:`<label class="btn" for="timport">Muat dari file cadangan…</label><input type="file" id="timport" accept=".json,application/json" hidden><span>Pilih file .json hasil "Unduh file cadangan".</span>`}</div>
      <p class="tnote">Simpanan otomatis selalu berisi permainan yang sedang berjalan. Slot menyimpan salinan tetap yang bisa dimuat kapan saja. Semua simpanan tersimpan di browser ini.</p></div>`}
  else if(v==='confirmnew')body=`<div class="tpanel"><h2>Mulai permainan baru?</h2><p>Permainan ${(auto?.S.name||'').replace(/</g,'&lt;')} yang sedang berjalan akan diganti. Simpan dulu ke slot bila ingin bisa memuatnya lagi.</p>
      <div class="tbtns"><button class="btn prim" data-a="tnewok">Mulai baru</button><button class="btn" data-a="tview" data-v="save">Simpan ke slot dulu</button><button class="btn" data-a="tview" data-v="main">Batal</button></div></div>`;
  el.innerHTML=`<div class="tveil"></div><div class="tbox">${head}${body}<div class="tfoot">Seret untuk menggeser peta · gulir untuk zoom · Q/E memutar kamera</div></div>`;
  const fi=$('#timport');if(fi)fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),st=o.S||o;if(!st||st.v!==9||st.seed==null)throw 0;loadState(st);closeTitle();toast(`${hn()} dimuat dari file`)}catch(e){toast('File tidak dikenali sebagai simpanan Vinterhald',true)}};r.readAsText(f)}}
function openTitle(v,fromGame){if(!U.title){U.prevSpeed=U.speed;U.speed=0}U.title=v||'main';U.titleFromGame=!!fromGame;renderTitle();refresh()}
function closeTitle(){U.title=null;U.titleFromGame=false;if(U.prevSpeed!=null){U.speed=U.prevSpeed||1;U.prevSpeed=null}renderTitle();refresh()}
function exportSave(){try{const b=new Blob([JSON.stringify({S,at:Date.now()})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`vinterhald-${(S.name||'hold').replace(/[^\w-]+/g,'_')}-hari${S.day}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('File cadangan diunduh')}catch(e){toast('Gagal membuat file cadangan',true)}}

function rebuildWorld(){
  for(const [,m] of BM)scene.remove(m.outer);BM.clear();for(const [,a] of AG)scene.remove(a.g);AG.clear();
  for(const m of [pillarGroup,hostileGroup])if(m)scene.remove(m);
  for(const [,c] of CARTS)scene.remove(c.g);CARTS.clear();for(const [,v] of AV)scene.remove(v.g);AV.clear();
  for(const [,v] of PLOTV)scene.remove(v.g);PLOTV.clear();for(const [,f] of FIREV)if(f.parent)f.parent.remove(f);FIREV.clear();if(FESTG){scene.remove(FESTG);FESTG=null}FESTK='';TREESIG='';
  buildTerrain();buildProps();initLabels();world.dirty=true;world.seasonDirty=true;buildRoads();syncBuildings();syncAgents();
  const h=hallPos();CAM.tx=h.x;CAM.tz=h.z+1;updCam();setGhost(null);refresh();
}
let last=performance.now(),lastSeason=-1;
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  if(U.title&&!reduce){CAM.yaw+=dt*.00004;updCam()}
  if(U.speed>0&&!S.jarlPick&&!U.title){U.acc+=dt*U.speed;let n=0,hd=0;while(U.acc>=HOUR_MS&&hd<30){U.acc-=HOUR_MS;hd++;S.hour=((S.hour??8)+1)%24;if(S.hour===0){simDay();n++}simHour()}if(hd>=30)U.acc=0;
    if(hd&&now-(U.topT||0)>600){U.topT=now;renderTop()}
    if(hd){syncBuildings();syncFire();syncFest();renderFest();if([6,8,17,21,22].includes(S.hour))wakeAgents();if(festActive()&&S.hour>=15&&!U.festCall){U.festCall=S.day;for(const g of AG.values())if(g.state==='rest'&&g.act!=='party')g.dur=Math.random()*2}if(U.festCall&&!festActive())U.festCall=0;$('#date').textContent=dateLine();if(!n&&U.sel&&U.sel.k==='bld'&&S.hour%3===0)refresh()}
    if(n){if(season()!==lastSeason){lastSeason=season();world.seasonDirty=true}syncBuildings();syncAgents();refresh();if(U.ov&&U.ov!=='none')world.paint=true}}
  dayNight(dt);audioFrame();stepFire(now);stepFollow(dt);stepSelRing(now);portFrame(now);if(U.sel&&U.sel.k==='cit'&&now-(U.pnowT||0)>700){U.pnowT=now;const pn=$('#pnow'),c=citById(U.sel.id);if(pn&&c)pn.textContent=actText(c)}
  if(world.dirty){world.dirty=false;world.borders=true;world.paint=true;world.props=true}
  if(world.seasonDirty){world.seasonDirty=false;world.paint=true;world.props=true;syncBuildings();buildRoads()}
  if(world.paint){world.paint=false;paintTerrain()}
  if(world.props){world.props=false;paintProps();FX.length=0;scene.traverse(o=>{if(o.userData.flick||o.userData.orb||o.userData.sail)FX.push(o)})}
  if(world.borders){world.borders=false;buildBorders()}
  const sdt=dt/1000;stepCarts(sdt);stepCaravan(sdt);stepAdv(sdt,now);stepAgents(sdt,now);stepRaid(sdt,now);stepSmoke(sdt*(U.speed?1:0));stepWater(now);
  stepWeather(sdt,now);SH.uTime.value=now/1000;
  if(!reduce){const fl=.85+.15*Math.sin(now/90);for(const o of FX){if(o.userData.flick)o.scale.setScalar(fl);if(o.userData.orb)o.position.y=1.68+Math.sin(now/500)*.05;if(o.userData.sail&&U.speed)o.rotation.z=-now/700}}
  updateLabels(false);
  renderFrame();requestAnimationFrame(frame);
}
function boot(data){
  if(typeof THREE==='undefined'){$('#boot').textContent='Pustaka 3D gagal dimuat. Muat ulang halaman.';return}
  S=(data&&data.S&&data.S.v===9)?data.S:load();if(S)Wd=genWorld(S.seed);else{newGame();save()}
  if(data&&data.U&&data.S&&data.S.v===9)Object.assign(U,data.U);
  $('#ledger').classList.toggle('shut',!U.book);setMin(!!U.min);
  window.claude?.hot?.snapshot?.(()=>({S,U:{tab:U.tab,speed:U.speed,sort:U.sort,sel:U.sel,book:U.book,min:U.min}}));
  migrate();
  initThree();makeIcons();initLabels();bindInput();resize();applyGQ();
  buildRoads();syncBuildings();syncAgents();syncFire();syncFest();renderJP();const h=hallPos();CAM.tx=h.x;CAM.tz=h.z+1;updCam();
  lastSeason=season();if(!(data&&data.S))openTitle('main');refresh();$('#boot').remove();requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
